<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Responsive SVG Clip Path</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        padding: 0;
        position: relative;
        width: 100%;
        min-height: 100svh;
      }

      .bottom {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #ff6b6b, #feca57);
        z-index: 0;
        display: flex;
        align-items: end;
        justify-content: center;
        padding-bottom: 40px;
        font-family: sans-serif;
        font-size: 1.5rem;
        color: white;
      }

      .top {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #5f27cd, #341f97);
        z-index: 1;
        clip-path: url(#wave);
        display: flex;
        align-items: start;
        justify-content: center;
        padding-top: 2rem;
        font-family: sans-serif;
        font-size: 1.5rem;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Hidden SVG for clip path definition -->
    <svg
      width="0"
      height="0"
    >
      <defs>
        <clipPath
          id="wave"
          clipPathUnits="objectBoundingBox"
        >
          <path
            d="
              M0,0
              L1,0 L1,0.7
              Q0.75,0.85 0.5,0.7
              Q0.25,0.55 0,0.7
              Z "
          />
        </clipPath>
      </defs>
    </svg>

    <div class="container">
      <div class="bottom">I'm underneath! 👋</div>
      <div class="top">Top div with wave clip</div>
    </div>
  </body>
</html>
