<svg stroke-width=".75" color="currentColor" viewBox="0 0 24 24" fill="currentColor" class="truck" style="position: absolute; left: 0;">
  <style>
    .truck {
      animation: drive 4s linear infinite;
      transform-origin: center center;
    }
    @keyframes drive {
      0% {
        left: 0;
        transform: scaleX(1);
      }
      49.9% {
        left: calc(100% - clamp(80px, 25svw, 120px));
        transform: scaleX(1);
      }
      50% {
        left: calc(100% - clamp(80px, 25svw, 120px));
        transform: scaleX(-1);
      }
      99.9% {
        left: 0;
        transform: scaleX(-1);
      }
      100% {
        left: 0;
        transform: scaleX(1);
      }
    }
  </style>
  <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="1.5" d="M8 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4m10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4"></path>
  <path fill="none" stroke="currentColor" stroke-linecap="round" d="M10.05 17H15V6.6a.6.6 0 0 0-.6-.6H1m4.65 11H3.6a.6.6 0 0 1-.6-.6v-4.9"></path>
  <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M2 9h4"></path>
  <path fill="none" stroke="currentColor" stroke-linecap="round" d="M15 9h5.61a.6.6 0 0 1 .548.356l1.79 4.028a.6.6 0 0 1 .052.243V16.4a.6.6 0 0 1-.6.6h-1.9M15 17h1"></path>
