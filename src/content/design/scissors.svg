        stroke-linejoin: round;
    }
    .white {
        fill: rgba(255,255,255,1);
    }
    .stroke4 {stroke-width: var(--stroke_unitless, 10);}
</style>

    <circle class="brand stroke4 white" cx="100" cy="100" r="50"></circle>
    <circle class="brand stroke4 white" cx="100" cy="300" r="50"></circle>
    <line class="brand stroke4" x1="333.33" y1="66.67" x2="135.33" y2="264.67"></line>
    <line class="brand stroke4" x1="241.17" y1="241.33" x2="333.33" y2="333.33"></line>
    <line class="brand stroke4" x1="135.33" y1="135.33" x2="200" y2="200"></line>
</svg>
